<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>JU Academic Record</title>
  <style>
    /* ---------- BASE ---------- */
    *{ box-sizing: border-box; margin:0; padding:0; }
    body{
      background: #e5e7eb;
      font-family: "Times New Roman", Times, serif;
      color: #111;
      font-size: 11px;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
      padding: 10px;
    }
    .actions{
      position: fixed; top: 10px; right: 10px;
      display: flex; gap: 6px; z-index: 100;
    }
    .actions button{
      padding: 8px 14px; border-radius: 8px; border: 0;
      background: #2563eb; color: #fff; cursor: pointer;
      font-weight: 600; font-family: system-ui, sans-serif; font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .actions button.sec{ background: #475569; }

    /* ---------- PAGE CONTAINER ---------- */
    .page{
      width: 100%;
      max-width: 210mm;          /* A4 width */
      min-height: 297mm;
      margin: 10px auto;
      padding: 8mm 6mm;
      background: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
      position: relative;
      display: flex;
      flex-direction: column;
      page-break-after: always;
    }
    .page:last-child{ page-break-after: auto; }

    /* ---------- HEADER (first page only) ---------- */
    h1{ font-size: 15px; font-weight: bold; text-align: center; letter-spacing: .5px; }
    .subtitle{ font-size: 13px; font-weight: bold; letter-spacing: 1px; text-align: center; margin-bottom: 8px; }
    .head{
      display: flex; justify-content: space-between;
      font-size: 10px; line-height: 1.35; margin-bottom: 6px;
    }
    .head > div{ flex: 1; }
    .head .mid{ text-align: center; }
    .head .rt{ text-align: right; }

    .info-box{
      border: 1px solid #111; font-size: 10px; margin-bottom: 10px;
    }
    .info-row{
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      border-bottom: 1px solid #111;
    }
    .info-row:last-child{ border-bottom: 0; }
    .info-cell{ padding: 3px 5px; border-right: 1px solid #111; }
    .info-cell:last-child{ border-right: 0; }
    .info-cell b{ font-weight: bold; }

    /* ---------- CONTINUATION HEADER (pages 2+) ---------- */
    .continuation-head{
      display: flex; justify-content: space-between;
      font-size: 10px; font-weight: bold;
      border-bottom: 2px solid #111;
      padding-bottom: 4px; margin-bottom: 10px;
    }

    /* ---------- SEMESTER GRID ---------- */
    .grid{
      display: grid;
      grid-template-columns: 1fr 1fr; /* two columns on all screens */
      gap: 10px;
    }
    .sem{
      border: 1px solid #111; font-size: 9px;
      page-break-inside: avoid;
    }
    .sem .titlebar{
      text-align: center; font-weight: bold;
      padding: 3px 2px; border-bottom: 1px solid #111;
      background: #eaeaea;
    }
    .sem .subtitle-sm{
      text-align: center; font-style: italic;
      font-size: 8px; padding: 2px 3px;
      border-bottom: 1px solid #111;
    }

    /* ---------- TABLES ---------- */
    table{ width: 100%; border-collapse: collapse; }
    th, td{ padding: 2px 3px; border-bottom: 1px solid #ccc; vertical-align: top; }
    th{
      font-weight: bold; font-size: 8px; text-align: left;
      background: #f9f9f9; border-bottom: 1px solid #111;
    }
    td.num, th.num{ text-align: right; white-space: nowrap; }
    td.center{ text-align: center; }

    .totals{
      display: grid; grid-template-columns: 1fr auto auto;
      border-top: 1px solid #111; font-weight: bold; background: #f9f9f9;
    }
    .totals > div{ padding: 2px 3px; border-right: 1px solid #ccc; }
    .totals > div:last-child{ border-right: 0; }

    .summary{
      padding: 2px 3px; font-style: italic; font-size: 8px;
      border-top: 1px solid #111; text-align: center; background: #f9f9f9;
    }

    /* ---------- FOOTER ---------- */
    .footer{
      margin-top: 10px; border-top: 1px solid #111;
      padding-top: 4px; font-size: 7px; line-height: 1.3;
      text-align: justify;
    }
    .footer-sign{
      display: flex; justify-content: space-between;
      align-items: flex-end; margin-top: 20px; font-size: 9px;
    }
    .stamp{
      border: 2px solid #1f4ea1; color: #1f4ea1;
      padding: 3px 8px; transform: rotate(-5deg);
      font-weight: bold; font-size: 10px; letter-spacing: 1px;
      position: absolute; right: 15mm; bottom: 30mm;
    }

    /* ---------- MOBILE SAFETY ---------- */
    @media (max-width: 600px){
      body{ padding: 6px; }
      .page{ padding: 6mm 4mm; min-height: auto; }
      .grid{ gap: 6px; }
      .sem{ font-size: 8.5px; }
      th, td{ padding: 1.5px 2px; }
      .actions button{ padding: 6px 10px; font-size: 11px; }
    }

    /* ---------- PRINT (STRICT A4 2-PAGE) ---------- */
    @media print{
      body{ background: #fff; padding: 0; }
      .actions{ display: none; }
      .page{
        margin: 0; box-shadow: none; width: auto;
        padding: 8mm 6mm;
        min-height: 297mm;
      }
      .grid{ gap: 8px; }
      .sem{ font-size: 9px; }
      .stamp{ right: 15mm; bottom: 28mm; }
    }
  </style>
</head>
<body>
  <div class="actions">
    <button onclick="window.print()">🖨 Print / Save PDF</button>
    <button class="sec" onclick="window.close()">Close</button>
  </div>

  <div id="pages-container"></div>

  <script src="transcript.js"></script>
</body>
</html>
