<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JU Academic Record</title>
  <style>
    @page { size: A4; margin: 10mm; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e5e7eb; font-family: "Times New Roman", Times, serif; color: #111; font-size: 11px; }
    
    .page { 
      width: 210mm; min-height: 297mm; margin: 10mm auto; padding: 10mm 8mm; 
      background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.15); position: relative; 
      page-break-after: always; display: flex; flex-direction: column;
    }
    .page:last-child { page-break-after: auto; }
    @media print { body { background: #fff; } .page { margin: 0; box-shadow: none; width: auto; } }

    .page-content { flex: 1; }
    
    h1 { font-size: 16px; font-weight: bold; margin: 0 0 4px; text-align: center; letter-spacing: .5px; }
    .subtitle { font-size: 14px; font-weight: bold; letter-spacing: 1px; text-align: center; margin-bottom: 12px; }

    .head { display: flex; justify-content: space-between; font-size: 11px; line-height: 1.4; margin-bottom: 8px; }
    .head > div { flex: 1; }
    .head .mid { text-align: center; }
    .head .rt  { text-align: right; }

    .info-box { border: 1px solid #111; font-size: 11px; margin-bottom: 12px; }
    .info-row { display: grid; grid-template-columns: 1fr 1fr 1fr; border-bottom: 1px solid #111; }
    .info-row:last-child { border-bottom: 0; }
    .info-cell { padding: 4px 6px; border-right: 1px solid #111; }
    .info-cell:last-child { border-right: 0; }
    .info-cell b { font-weight: bold; }

    .continuation-head { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; border-bottom: 2px solid #111; padding-bottom: 4px; margin-bottom: 12px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    .sem { border: 1px solid #111; font-size: 10px; page-break-inside: avoid; }
    .sem .titlebar { text-align: center; font-weight: bold; padding: 4px; border-bottom: 1px solid #111; background: #eaeaea; }
    .sem .subtitle-sm { text-align: center; font-style: italic; font-size: 9px; padding: 2px 4px; border-bottom: 1px solid #111; }
    
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 2px 4px; border-bottom: 1px solid #ccc; vertical-align: top; }
    th { font-weight: bold; font-size: 9px; text-align: left; background: #f9f9f9; border-bottom: 1px solid #111; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    td.center { text-align: center; }
    
    .totals { display: grid; grid-template-columns: 1fr auto auto; border-top: 1px solid #111; font-weight: bold; background: #f9f9f9; }
    .totals > div { padding: 3px 4px; border-right: 1px solid #ccc; }
    .totals > div:last-child { border-right: 0; }
    
    .summary { padding: 3px 4px; font-style: italic; font-size: 9px; border-top: 1px solid #111; text-align: center; background: #f9f9f9; }

    .footer { 
      margin-top: 12px; border-top: 1px solid #111; padding-top: 6px; font-size: 8px; line-height: 1.3; 
      text-align: justify;
    }
    .footer-sign { 
      display: flex; justify-content: space-between; align-items: flex-end; margin-top: 24px; font-size: 10px; 
    }
    .stamp { 
      border: 2px solid #1f4ea1; color: #1f4ea1; padding: 4px 10px; transform: rotate(-5deg); 
      font-weight: bold; font-size: 11px; letter-spacing: 1px; position: absolute; right: 25mm; bottom: 35mm;
    }

    .actions { position: fixed; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 100; }
    .actions button { padding: 8px 12px; border-radius: 8px; border: 0; background: #2563eb; color: #fff; cursor: pointer; font-weight: 600; font-family: system-ui, sans-serif; font-size: 14px; }
    .actions button.sec { background: #475569; }
    @media print { .actions { display: none; } }
  </style>
</head>
<body>
  <div class="actions">
    <button onclick="window.print()">🖨 Print / Save PDF</button>
    <button class="sec" onclick="window.close()">Close</button>
  </div>

  <div id="pages-container"></div>

  <script src="transcript.js"></script>
</body>
</html>
